name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -d postgres -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest

      - name: Initialize database
        run: uv run src/init_db.py

      - name: Run dbt build
        run: uv run dbt build --project-dir dbt-transformation --profiles-dir dbt-transformation